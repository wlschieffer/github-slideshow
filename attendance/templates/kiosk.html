<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="kiosk">
  <div class="topnav">
    <span class="brand">Scan In</span>
    <div class="period-picker">
      Period:
      <select id="period">
        {% for p in periods %}
          <option value="{{ p.id }}" {{ 'selected' if p.id == selected_period }}>
            {{ p.name }} ({{ p.start_time }}–{{ p.end_time }})
          </option>
        {% endfor %}
      </select>
    </div>
    <a href="{{ url_for('admin') }}">Staff&nbsp;&rsaquo;</a>
  </div>

  <div class="kiosk-main">
    <div id="banner" class="banner idle">
      <div class="status">Ready</div>
      <div class="sub">Scan your ID to check in</div>
    </div>
    <input id="scan" class="scan-input" autocomplete="off" autofocus
           placeholder="Scan or type ID, then Enter">
    <div class="hint">The cursor stays here automatically. Just scan.</div>
  </div>

  <script>
    const input = document.getElementById('scan');
    const banner = document.getElementById('banner');
    const periodSel = document.getElementById('period');

    // Keep focus on the input so the scanner always lands here.
    function refocus() { input.focus(); }
    document.addEventListener('click', refocus);
    window.addEventListener('load', refocus);

    let resetTimer = null;
    function show(cls, status, name, sub) {
      banner.className = 'banner ' + cls;
      banner.innerHTML =
        '<div class="status">' + status + '</div>' +
        (name ? '<div class="name">' + name + '</div>' : '') +
        (sub ? '<div class="sub">' + sub + '</div>' : '');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        banner.className = 'banner idle';
        banner.innerHTML =
          '<div class="status">Ready</div>' +
          '<div class="sub">Scan your ID to check in</div>';
      }, 4000);
    }

    async function submitScan(value) {
      const body = new URLSearchParams({ student_id: value, period_id: periodSel.value });
      const res = await fetch('{{ url_for("scan") }}', { method: 'POST', body });
      const d = await res.json();
      const detail = d.grade ? (d.grade + ' · ' + d.message) : d.message;
      if (d.status === 'ok') {
        show('ok', '✓ Welcome', d.name, d.time ? ('Checked in at ' + d.time) : '');
      } else if (d.status === 'duplicate') {
        show('duplicate', 'Already In', d.name, d.time ? ('First scan at ' + d.time) : '');
      } else if (d.status === 'inactive') {
        show('inactive', '✕ Inactive ID', d.name, 'See the front office');
      } else {
        show('unknown', '✕ Not Recognized', '', 'See staff — ID not on the roster');
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = input.value.trim();
        input.value = '';
        if (v) submitScan(v);
        refocus();
      }
    });
  </script>
</body>
</html>
